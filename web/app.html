<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Banthry Courtroom</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
    <style>
      body{margin:0;background:#100E0C;color:#F3EEE5}
      *{box-sizing:border-box}
      a{color:#F3EEE5}
      button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #F08A62;outline-offset:2px}
      @keyframes bc-eq{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}
      @keyframes bc-pulse{0%,100%{opacity:1}50%{opacity:.3}}
      @keyframes bc-glow{0%,100%{box-shadow:0 0 0 0 rgba(240,138,98,.55)}50%{box-shadow:0 0 0 14px rgba(240,138,98,0)}}
      @keyframes bc-pop{0%{transform:translateY(8px) scale(.96);opacity:0}100%{transform:none;opacity:1}}
      @keyframes bc-in{0%{transform:translateY(6px);opacity:0}100%{transform:none;opacity:1}}
      @media (max-width: 900px){.bc-float{display:none !important}}
      @media (prefers-reduced-motion: reduce){*{animation:none !important}}
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
